<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Crunchyroll Speed</title>
<link rel="stylesheet" href="popup.css">
<body>
  <h1>Crunchyroll Speed</h1>
  <div role="group" aria-label="Playback speed">
    <button data-speed="1" aria-pressed="false">1×</button>
    <button data-speed="1.5" aria-pressed="false">1.5×</button>
    <button data-speed="2" aria-pressed="false">2×</button>
  </div>
  <p id="status" role="status">Choose a playback speed.</p>
  <small>Applies to all open Crunchyroll videos. Your choice is remembered.</small>
  <script src="popup.js"></script>
</body>
</html>
